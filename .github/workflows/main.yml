name: Build ChartScanner EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Windows EXE
        shell: cmd
        run: |
          C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe /target:winexe /out:ChartScanner.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll ChartScanner.cs

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChartScanner-EXE
          path: ChartScanner.exe
